name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: dummy
          QC_ADMIN_API_KEY: dummy
          RABBITMQ_PASSWORD: dummy
          GEMINI_API_KEY: dummy
        run: docker compose config

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: verify
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Package source
        run: |
          set -euo pipefail
          tar -czf /tmp/tool-report-qc-${GITHUB_SHA}.tgz \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            .

      - name: Deploy selected commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key -P "${VPS_PORT:-22}" \
            /tmp/tool-report-qc-${GITHUB_SHA}.tgz \
            "${VPS_USER}@${VPS_HOST}:/tmp/tool-report-qc-${GITHUB_SHA}.tgz"
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" \
            "set -euo pipefail
             test \"${VPS_APP_DIR}\" = \"/opt/tool-report-qc\"
             mkdir -p /srv/tool-report-qc/uploads
             mkdir -p \"${VPS_APP_DIR}\"
             test -f \"${VPS_APP_DIR}/.env\"
             find \"${VPS_APP_DIR}\" -mindepth 1 -maxdepth 1 ! -name .env -exec rm -rf {} +
             tar -xzf /tmp/tool-report-qc-${GITHUB_SHA}.tgz -C \"${VPS_APP_DIR}\"
             rm -f /tmp/tool-report-qc-${GITHUB_SHA}.tgz
             cd \"${VPS_APP_DIR}\"
             docker compose -p tool-report-qc up -d --build
             docker compose -p tool-report-qc ps
             curl --fail http://127.0.0.1:3020/api/health"
